# Mission configuration for dummy_robot (LLM orchestrator mode).
# orchestrator_type: "llm" tells behavior_architecture to use LLMPlanOrchestrator.
# This launcher now starts only mission_executor + start_mission.
# Planner and BT builder nodes should be launched separately when needed.
#
# Usage:
#   ros2 launch dummy_robot dummy_robot_llm.launch.py

# ── Common fields ─────────────────────────────────────────────────────────────
node_name: "dummy_robot_bt_node"
orchestrator_type: "llm"
package_name: "dummy_robot"

# BT plugin that provides the action nodes available to the LLM BT builder.
plugin_libraries:
  - "libdummy_bt_nodes_plugin.so"

# Packages whose node_descriptions/*.yaml the BT builder uses to know which
# BT action nodes exist and how to use them.
bt_nodes_packages:
  - "dummy_bt_nodes"
bt_control_period_ms: 50
bt_timeout_sec: 60.0

# ── Goal definition ───────────────────────────────────────────────────────────
# Sent to llm_planner at start-up via the /start_mission service.
# Skills are defined in dummy_robot_skills.yaml and passed via the 'skills_file' launch arg.
# ── Execution logging ─────────────────────────────────────────────────────────
# save_exec: true  → saves generated BT XMLs to <exec_dir>/<mission_name>/<timestamp>/
# Can also be enabled at launch time with save_exec:=true
save_exec: true
exec_dir: "/home/roi/UNI/robots/ros2/social_ws/exec"

mission_name: "restaurant_waiter"
goal: "Take the customer's full order and deliver food to the kitchen chef and drink to the bar waiter"
context: |
  A service robot acting as a waiter in a restaurant.

  The robot starts at the service counter. There are 5 tables where customers are seated.
  
  The kitchen is at the back of the restaurant where the chef works.
  
  The bar is at the front of the restaurant where the human bar waiter serves drinks.
  
  The robot must just spin until it identifies a customer ready to order, approach their table and tell the customer the list of available food, drinks, and desserts. 
  
  Then, the robot must ask an open-ended question to the customer to let them freely express their order.
  
  The robot must then extract the drink, main dish, and dessert from the customer's answer and confirm with the customer if the extracted items are correct. If the order is not correct, apologize, force a plan fail. This step can be repated max 2 times before giving up and failing the plan.

  Then, the robot must check whether the order items are available against the availability list. If any item is unavailable, apologize, and force a plan fail.
  
  Finally if there is not a plan fail, the robot must go to the kitchen to relay the food items (main dish and dessert) to the chef, then go to the bar to relay the drink to the waiter.

useful_info: |
  Available locations:
    - main_kitchen
    - bar
  Available food: pizza;steak;salad
  Available drinks: water;wine
  Available desserts: ice cream;cake

preconditions:
  - "Perception target for customer detection should be set to 'person' to ensure the robot can identify customers ready to order."
  - "The plan must NOT assume that the customer is visible or detectable at the start. The robot should just spin until it identifies a customer ready to order if their location is unknown or not directly observable."
  - "To identify a customer ready to order, the robot may spin until it detects a person."

postconditions:
  - "When communicating with the chef in the kitchen, the robot must exclusively relay the food items from the customer's order."
  - "When communicating with the bar waiter, the robot must exclusively relay the drink from the customer's order."
  - "To guarantee this strict isolation of information, the robot must capture and memorize the food selection and the drink selection as two entirely separate pieces of information right from the moment the customer speaks."

# ── Execution logging ─────────────────────────────────────────────────────────
# save_exec: true  → saves generated BT XMLs to <exec_dir>/<mission_name>/<timestamp>/
save_exec: true
exec_dir: "/home/roi/UNI/robots/ros2/social_ws/exec"